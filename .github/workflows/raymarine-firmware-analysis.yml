name: Raymarine firmware analysis

on:
  workflow_dispatch:
  push:
    branches:
      - raymarine-firmware-analysis
    paths:
      - .github/workflows/raymarine-firmware-analysis.yml
      - tools/axiom-yachtsense-detection.sh

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: raymarine-firmware-analysis
          fetch-depth: 0

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full unzip bzip2 tar squashfs-tools e2fsprogs file binutils \
            jq ripgrep curl git cargo python3 python3-pip libssl-dev make gcc \
            android-sdk-libsparse-utils

      - name: Extract Axiom and find YachtSense recognition code
        id: analyze
        continue-on-error: true
        run: bash tools/axiom-yachtsense-detection.sh

      - name: Publish compact report to analysis branch
        if: always()
        shell: bash
        run: |
          set -u
          rm -rf analysis-output
          mkdir -p analysis-output
          if [ -d report ]; then
            find report -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
              name="$(basename "$f")"
              size="$(stat -c %s "$f")"
              if [ "$size" -gt 40000000 ]; then
                head -c 40000000 "$f" > "analysis-output/$name"
                printf '\n[TRUNCATED AT 40 MB]\n' >> "analysis-output/$name"
              else
                cp "$f" "analysis-output/$name"
              fi
            done
          fi
          {
            echo "analysis_outcome=${{ steps.analyze.outcome }}"
            echo "published_at=$(date -u +%FT%TZ)"
            echo "source_commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } > analysis-output/workflow-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis-output
          git commit -m "Publish focused Axiom YachtSense analysis" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin raymarine-firmware-analysis && \
              git push origin HEAD:raymarine-firmware-analysis && exit 0
            sleep 3
          done
          exit 1

      - name: Upload Axiom analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-yachtsense-recognition-analysis
          path: report/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Mark analysis failure
        if: steps.analyze.outcome == 'failure'
        run: exit 1
