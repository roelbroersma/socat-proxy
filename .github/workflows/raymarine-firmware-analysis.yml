name: Raymarine firmware analysis

on:
  workflow_dispatch:
  push:
    branches:
      - raymarine-firmware-analysis
    paths:
      - .github/workflows/raymarine-firmware-analysis.yml
      - tools/raymarine-firmware-analysis.sh

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full unzip squashfs-tools e2fsprogs file binutils jq ripgrep \
            curl git cargo python3 python3-pip binwalk libssl-dev make gcc

      - name: Download, extract and analyze firmware
        id: analyze
        continue-on-error: true
        run: bash tools/raymarine-firmware-analysis.sh

      - name: Publish report to analysis branch
        if: always()
        shell: bash
        run: |
          set -u
          rm -rf analysis-output
          mkdir -p analysis-output
          if [ -d report ]; then
            find report -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
              name="$(basename "$f")"
              size="$(stat -c %s "$f")"
              if [ "$size" -gt 20000000 ]; then
                head -c 20000000 "$f" > "analysis-output/$name"
                printf '\n[TRUNCATED AT 20 MB]\n' >> "analysis-output/$name"
              else
                cp "$f" "analysis-output/$name"
              fi
            done
          fi
          {
            echo "install_outcome=${{ steps.install.outcome }}"
            echo "analysis_outcome=${{ steps.analyze.outcome }}"
            echo "published_at=$(date -u +%FT%TZ)"
            echo "source_commit=${GITHUB_SHA}"
          } > analysis-output/workflow-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-output
          git commit -m "Publish Raymarine firmware analysis results" || exit 0
          git push origin HEAD:raymarine-firmware-analysis

      - name: Upload full textual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raymarine-firmware-analysis-report
          path: report/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9

      - name: Mark failed analysis
        if: steps.install.outcome == 'failure' || steps.analyze.outcome == 'failure'
        run: exit 1
