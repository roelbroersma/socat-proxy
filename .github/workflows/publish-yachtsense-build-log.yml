name: Publish YachtSense build error log

on:
  push:
    branches:
      - yachtsense-rutos-vuci
    paths:
      - '.github/workflows/publish-yachtsense-build-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yachtsense-rutos-vuci
          fetch-depth: 0

      - name: Fetch failed SDK-build log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rutos-yachtsense
          curl -L --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/96568686054/logs" \
            -o /tmp/build.log
          tail -n 800 /tmp/build.log > rutos-yachtsense/last-build-log-tail.txt
          grep -Ein 'error|failed|No rule|not found|undefined|make\[[0-9]+\].*Error|exit code|syntax' /tmp/build.log \
            | tail -n 500 > rutos-yachtsense/last-build-errors.txt || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rutos-yachtsense/last-build-log-tail.txt rutos-yachtsense/last-build-errors.txt
          git commit -m "Publish latest YachtSense RutOS build errors" || exit 0
          git pull --rebase origin yachtsense-rutos-vuci
          git push origin HEAD:yachtsense-rutos-vuci
