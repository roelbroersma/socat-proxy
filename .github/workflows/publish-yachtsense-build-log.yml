name: Publish YachtSense build error log

# Refresh marker: latest-completed-build
on:
  push:
    branches:
      - yachtsense-rutos-vuci
    paths:
      - '.github/workflows/publish-yachtsense-build-log.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yachtsense-rutos-vuci
          fetch-depth: 0

      - name: Fetch latest completed SDK-build log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rutos-yachtsense
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsSL "${headers[@]}" \
            "${api}/actions/workflows/build-yachtsense-rutos.yml/runs?branch=yachtsense-rutos-vuci&status=completed&per_page=10" \
            -o /tmp/runs.json
          run_id="$(jq -r '[.workflow_runs[] | select(.name == "Build YachtSense RutOS package")][0].id // empty' /tmp/runs.json)"
          [ -n "$run_id" ]
          curl -fsSL "${headers[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100" -o /tmp/jobs.json
          job_id="$(jq -r '.jobs[0].id // empty' /tmp/jobs.json)"
          [ -n "$job_id" ]
          curl -fsSL -L "${headers[@]}" "${api}/actions/jobs/${job_id}/logs" -o /tmp/build.log

          {
            echo "run_id=${run_id}"
            echo "job_id=${job_id}"
            jq -r '.jobs[0] | "status=\(.status)\nconclusion=\(.conclusion)\nurl=\(.html_url)"' /tmp/jobs.json
          } > rutos-yachtsense/latest-log-source.txt
          tail -n 1200 /tmp/build.log > rutos-yachtsense/last-build-log-tail.txt
          grep -Ein -C 8 'error:|failed|fatal:|No rule|not found|undefined reference|syntax error|make\[[0-9]+\].*Error|exit code|not a TTY' /tmp/build.log \
            | tail -n 700 > rutos-yachtsense/last-build-errors.txt || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rutos-yachtsense/latest-log-source.txt rutos-yachtsense/last-build-log-tail.txt rutos-yachtsense/last-build-errors.txt
          git commit -m "Publish current YachtSense RutOS build errors" || exit 0
          git pull --rebase origin yachtsense-rutos-vuci
          git push origin HEAD:yachtsense-rutos-vuci
