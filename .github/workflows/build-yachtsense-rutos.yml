name: Build YachtSense RutOS package

on:
  push:
    branches:
      - yachtsense-rutos-vuci
    paths:
      - 'rutos-yachtsense/**'
      - '.github/workflows/build-yachtsense-rutos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out package source
        uses: actions/checkout@v4
        with:
          ref: yachtsense-rutos-vuci

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl jq tar gzip zip file binutils

      - name: Patch SDK build compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rutos-yachtsense/build.sh')
          text = path.read_text()
          needle = 'test -d "$SDK/package/feeds/vuci"\n'
          patch = r'''
          log "Patching SDK container for CI and current RubyGems"
          PATCHED_DOCKERFILES=0
          while IFS= read -r dockerfile; do
            sed -i 's/gem install ceedling/gem install ceedling --no-document/g' "$dockerfile"
            grep -n 'gem install ceedling' "$dockerfile" | tee -a "$DIST/sdk-docker-patches.txt"
            PATCHED_DOCKERFILES=$((PATCHED_DOCKERFILES + 1))
          done < <(grep -RIl --include='Dockerfile*' 'gem install ceedling' "$SDK")
          test "$PATCHED_DOCKERFILES" -gt 0

          # Teltonika's helper always requests an interactive TTY. GitHub Actions
          # has no TTY, so retain stdin but remove the -t flag.
          sed -i 's/run -it/run -i/' "$SDK/scripts/dockerbuild"
          grep -n 'DOCKER_CMD run' "$SDK/scripts/dockerbuild" | tee -a "$DIST/sdk-docker-patches.txt"
          '''.strip('\n')
          if 'Patching SDK container for CI and current RubyGems' not in text:
              if needle not in text:
                  raise SystemExit('SDK insertion point not found')
              text = text.replace(needle, needle + '\n' + patch + '\n', 1)
              path.write_text(text)
          PY
          bash -n rutos-yachtsense/build.sh

      - name: Build against official RUTX RutOS 7.24.1 SDK
        run: bash rutos-yachtsense/build.sh

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: YachtSense-Link-Emulator-RUTX14-RutOS-7.24.1
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
